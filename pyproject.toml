[project]
name = "fdsml"
version = "0.1.0"
description = "Official PyTorch implementation of the paper 'FDSML: Formula-Driven Supervised Metric Learning with Parameter-Aware Triplet Loss'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asciichartpy>=1.5.25",
    "click>=8.3.3",
    "gdown>=6.0.0",
    "matplotlib>=3.10.9",
    "nltk>=3.9.4",
    "numba>=0.65.1",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.2",
    "paramiko>=4.0.0",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "umap-learn>=0.5.12",
    "wandb>=0.26.1",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
pyviewer = { git = "https://github.com/harskish/pyviewer.git" }
nfdpy = { git = "https://github.com/ShineiArakawa/nfdpy.git" }

[dependency-groups]
dev = [
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
]
viz = [
    "cachetools>=7.0.6",
    "glfw>=2.8.0",
    "imgui-bundle>=1.92.5",
    "loguru>=0.7.3",
    "natsort>=8.4.0",
    "nfdpy",
    "pyglm>=2.8.3",
    "pyopengl>=3.1.7",
    "pyopengl-accelerate>=3.1.10",
    "pyviewer",
    "resize-right>=0.0.2",
]
